      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="220" rx="12" fill="url(#bg-u1t)" stroke="#334155" stroke-width="1.5"/>
