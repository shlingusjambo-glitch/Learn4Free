<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">ONE-WAY HASH FUNCTIONS &amp; AVALANCHE EFFECT</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">SHA-256 compresses arbitrary input into a 64-hex string. Strictly one-way trapdoor.</text>

    <!-- Hash Engine Box -->
    <g transform="translate(30, 80)">
      <rect width="540" height="185" rx="8" fill="url(#cardGrad)" stroke="#253158" stroke-width="1.5"/>

      <!-- Input 1 -->
      <text x="25" y="45" font-family="monospace" font-size="12" fill="#38bdf8">Input: "Attack at dawn"</text>
      <path d="M 190 41 L 230 41" stroke="#38bdf8" stroke-width="2"/>
      <rect x="240" y="28" width="120" height="26" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="300" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">SHA-256</text>
      <path d="M 370 41 L 410 41" stroke="#38bdf8" stroke-width="2"/>
      <text x="420" y="45" font-family="monospace" font-size="11" fill="#34d399">a8f2...7b10 (64 chars)</text>

      <!-- Input 2: One character changed (dawn -> dawn.) -->
      <text x="25" y="95" font-family="monospace" font-size="12" fill="#ffd600">Input: "Attack at dawn."</text>
      <path d="M 190 91 L 230 91" stroke="#ffd600" stroke-width="2"/>
      <rect x="240" y="78" width="120" height="26" rx="4" fill="#1e293b" stroke="#ffd600" stroke-width="1"/>
      <text x="300" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffd600">SHA-256</text>
      <path d="M 370 91 L 410 91" stroke="#ffd600" stroke-width="2"/>
      <text x="420" y="95" font-family="monospace" font-size="11" fill="#ffd600">4e01...99bc (COMPLETELY DIFFERENT)</text>

      <!-- Avalanche & One-way warning footer -->
      <rect x="20" y="130" width="500" height="42" rx="6" fill="#0c1124" stroke="#f87171" stroke-width="1"/>
      <text x="35" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">THE AVALANCHE EFFECT:</text>
      <text x="180" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">Changing 1 bit in input changes ~50% of output bits.</text>
      <text x="35" y="164" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">No math exists to calculate the original text from the hash (One-Way Property).</text>
    </g>
  
</svg>