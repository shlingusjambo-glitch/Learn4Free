<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">PASSWORD ENTROPY: LENGTH vs. COMPLEXITY</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">XKCD 936: Length &amp; unpredictable words beat short complex gibberish.</text>

    <!-- Visual Comparison Cards -->
    <g transform="translate(30, 80)">
      <!-- Weak Card -->
      <rect x="0" y="0" width="260" height="185" rx="8" fill="url(#cardGrad)" stroke="#f87171" stroke-width="1.5"/>
      <rect x="15" y="15" width="60" height="20" rx="3" fill="#dc2626" fill-opacity="0.2"/>
      <text x="23" y="29" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171">WEAK</text>
      <text x="15" y="58" font-family="monospace" font-size="14" font-weight="700" fill="#e2e8f0">"Tr0ub4dor&amp;3"</text>
      <text x="15" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Length: 11 characters</text>
      <text x="15" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Predictable substitutions (0 for o, 3 for e)</text>
      <text x="15" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">Cracking time: ~3 days</text>
      <text x="15" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#fca5a5">Humans forget it; computers crack it easily.</text>
    </g>

    <g transform="translate(310, 80)">
      <!-- Strong Card -->
      <rect x="0" y="0" width="260" height="185" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
      <rect x="15" y="15" width="70" height="20" rx="3" fill="#059669" fill-opacity="0.2"/>
      <text x="23" y="29" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">STRONG</text>
      <text x="15" y="58" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">"correct horse battery staple"</text>
      <text x="15" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Length: 28 characters (Entropy: ~44 bits)</text>
      <text x="15" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Four random independent dictionary words</text>
      <text x="15" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Cracking time: ~550 years</text>
      <text x="15" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7">Humans can visualize it; impossible to guess.</text>
    </g>
  
</svg>