<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">PREPARED STATEMENTS &amp; PARAMETER BINDING</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">The database pre-compiles the query structure. User input is treated strictly as inert data.</text>

    <!-- Safe Flow Diagram -->
    <g transform="translate(30, 80)">
      <rect width="540" height="185" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>

      <!-- SQL Template -->
      <g transform="translate(20, 20)">
        <rect width="230" height="70" rx="6" fill="#0c1124" stroke="#38bdf8" stroke-width="1"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1. QUERY BLUEPRINT (Pre-compiled)</text>
        <text x="15" y="48" font-family="monospace" font-size="10" fill="#e2e8f0">SELECT * FROM users WHERE</text>
        <text x="15" y="62" font-family="monospace" font-size="10" fill="#ffd600">username = ? AND pass = ?</text>
      </g>

      <!-- Inert Data Capsule -->
      <g transform="translate(290, 20)">
        <rect width="230" height="70" rx="6" fill="#0c1124" stroke="#34d399" stroke-width="1"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">2. INERT DATA PARAMETER</text>
        <text x="15" y="48" font-family="monospace" font-size="10" fill="#f87171">payload = "' OR '1'='1"</text>
        <text x="15" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Quarantined inside parameter tuple</text>
      </g>

      <!-- Database Evaluation -->
      <g transform="translate(20, 105)">
        <rect width="500" height="65" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">SAFE EXECUTION IN SQLITE:</text>
        <text x="15" y="44" font-family="monospace" font-size="11" fill="#e2e8f0">cursor.execute("SELECT ... WHERE user = ?", (payload,))</text>
        <text x="15" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">Database searches for a literal username named "' OR '1'='1". Zero rows returned. Exploit fails!</text>
      </g>
    </g>
  
</svg>