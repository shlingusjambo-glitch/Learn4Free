<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">BUFFER OVERFLOW DEFENSE: BOUNDS CHECKING</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Pouring 16 ounces into an 8-ounce mug: overwriting adjacent memory and return pointers.</text>

    <!-- Memory Layout Stack Diagram -->
    <g transform="translate(30, 80)">
      <rect width="540" height="185" rx="8" fill="url(#cardGrad)" stroke="#253158" stroke-width="1.5"/>

      <!-- Safe Bounds Check Left -->
      <g transform="translate(20, 20)">
        <rect width="230" height="145" rx="6" fill="#0c1124" stroke="#34d399" stroke-width="1.5"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">DEFENSIVE BOUNDS CHECK</text>
        <rect x="15" y="38" width="200" height="30" rx="3" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
        <text x="115" y="57" text-anchor="middle" font-family="monospace" font-size="11" fill="#34d399">Buffer: 8 bytes reserved</text>

        <text x="15" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Incoming payload: 14 bytes</text>
        <text x="15" y="106" font-family="monospace" font-size="10" fill="#ffd600">if len(data) &gt; capacity: REJECT</text>
        <rect x="15" y="116" width="200" height="20" rx="2" fill="#34d399" fill-opacity="0.2"/>
        <text x="115" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">MEMORY INTEGRITY SAVED</text>
      </g>

      <!-- Dangerous Overflow Right -->
      <g transform="translate(290, 20)">
        <rect width="230" height="145" rx="6" fill="#0c1124" stroke="#f87171" stroke-width="1.5"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">UNCHECKED C BUFFER OVERFLOW</text>

        <rect x="15" y="38" width="100" height="30" rx="2" fill="#374151"/>
        <text x="65" y="57" text-anchor="middle" font-family="monospace" font-size="9" fill="#e2e8f0">Buffer (8B)</text>

        <rect x="115" y="38" width="100" height="30" rx="2" fill="#dc2626"/>
        <text x="165" y="57" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#ffffff">RET PTR</text>

        <!-- Spillover arrow -->
        <path d="M 15 80 L 210 80" stroke="#f87171" stroke-width="3" stroke-dasharray="4,4"/>
        <text x="15" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#fca5a5">Overfill overwrites return instruction pointer!</text>
        <rect x="15" y="116" width="200" height="20" rx="2" fill="#dc2626" fill-opacity="0.2"/>
        <text x="115" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171">ARBITRARY CODE EXECUTION</text>
      </g>
    </g>
  
</svg>