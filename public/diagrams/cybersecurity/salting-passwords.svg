<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">PASSWORD SALTING DEFEATS RAINBOW TABLES</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">A unique random salt ensures identical passwords never produce identical hashes.</text>

    <!-- Side-by-side comparison -->
    <g transform="translate(30, 78)">
      <!-- Unsalted Flaw -->
      <rect x="0" y="0" width="260" height="190" rx="8" fill="url(#cardGrad)" stroke="#f87171" stroke-width="1.5"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">UNSALTED (VULNERABLE)</text>
      <text x="15" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Two users have password "dragon":</text>

      <rect x="15" y="55" width="230" height="48" rx="4" fill="#0c1124"/>
      <text x="25" y="74" font-family="monospace" font-size="11" fill="#e2e8f0">User A: sha256("dragon")</text>
      <text x="25" y="92" font-family="monospace" font-size="10" fill="#f87171">-> ef92... identical hash!</text>

      <rect x="15" y="110" width="230" height="48" rx="4" fill="#0c1124"/>
      <text x="25" y="129" font-family="monospace" font-size="11" fill="#e2e8f0">User B: sha256("dragon")</text>
      <text x="25" y="147" font-family="monospace" font-size="10" fill="#f87171">-> ef92... identical hash!</text>

      <text x="130" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Cracked instantly by Rainbow Table!</text>

      <!-- Salted Defense -->
      <rect x="280" y="0" width="260" height="190" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
      <text x="295" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">SALTED WITH RANDOM BYTES</text>
      <text x="295" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Unique salt per user:</text>

      <rect x="295" y="55" width="230" height="48" rx="4" fill="#0c1124"/>
      <text x="305" y="74" font-family="monospace" font-size="10" fill="#e2e8f0">sha256("s4Lt_1" + "dragon")</text>
      <text x="305" y="92" font-family="monospace" font-size="10" fill="#34d399">-> 8c12... (Unique A)</text>

      <rect x="295" y="110" width="230" height="48" rx="4" fill="#0c1124"/>
      <text x="305" y="129" font-family="monospace" font-size="10" fill="#e2e8f0">sha256("x9Zq_2" + "dragon")</text>
      <text x="305" y="147" font-family="monospace" font-size="10" fill="#34d399">-> 2f7a... (Unique B)</text>

      <text x="410" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Rainbow Tables completely neutralized!</text>
    </g>
  
</svg>