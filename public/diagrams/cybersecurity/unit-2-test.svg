<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">BANK VAULT AUTHENTICATION ARCHITECTURE</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">End-to-end credential lifecycle: entropy check, secure salt generation, constant-time compare.</text>

    <!-- Architecture flow -->
    <g transform="translate(30, 80)">
      <rect width="540" height="185" rx="8" fill="url(#cardGrad)" stroke="#253158" stroke-width="1.5"/>

      <!-- Step 1 -->
      <g transform="translate(20, 25)">
        <circle cx="20" cy="20" r="16" fill="#38bdf8" fill-opacity="0.2"/>
        <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1</text>
        <text x="45" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Password Policy</text>
        <text x="45" y="34" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Length &gt;= 10, Upper, Lower, Digit, Symbol</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(20, 75)">
        <circle cx="20" cy="20" r="16" fill="#ffd600" fill-opacity="0.2"/>
        <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffd600">2</text>
        <text x="45" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Crypto Salt Generation</text>
        <text x="45" y="34" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Unique 16-byte random hex salt per account</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(20, 125)">
        <circle cx="20" cy="20" r="16" fill="#34d399" fill-opacity="0.2"/>
        <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">3</text>
        <text x="45" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Secure Vault Storage &amp; Verification</text>
        <text x="45" y="34" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Store "salt$hash". Zero password recovery possible.</text>
      </g>

      <!-- Vault Graphic -->
      <g transform="translate(380, 30)">
        <rect width="130" height="125" rx="8" fill="#0c1124" stroke="#ffd600" stroke-width="2"/>
        <circle cx="65" cy="62" r="32" fill="#1b2447" stroke="#ffd600" stroke-width="3"/>
        <circle cx="65" cy="62" r="8" fill="#ffd600"/>
        <line x1="65" y1="30" x2="65" y2="94" stroke="#ffd600" stroke-width="2"/>
        <line x1="33" y1="62" x2="97" y2="62" stroke="#ffd600" stroke-width="2"/>
        <text x="65" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffd600">VAULT LOCK</text>
      </g>
    </g>
  
</svg>