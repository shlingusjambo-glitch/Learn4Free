<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">MISSION IMPOSSIBLE: MULTI-LAYER DECODER</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Unwrapping the spy transmission: Base64 Decode → Caesar Unshift → XOR Decrypt.</text>

    <!-- 3 Step Processing Pipeline -->
    <g transform="translate(30, 85)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="165" height="175" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="82" cy="30" r="16" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="82" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1</text>
      <text x="82" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Base64 Decode</text>
      <text x="82" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Unpack raw bytes</text>
      <rect x="15" y="105" width="135" height="50" rx="4" fill="#0c1124"/>
      <text x="82" y="125" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffd600">b64decode()</text>
      <text x="82" y="142" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">ASCII -> Bytes</text>

      <!-- Stage 2 -->
      <rect x="187" y="0" width="165" height="175" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5"/>
      <circle cx="269" cy="30" r="16" fill="#c084fc" fill-opacity="0.2"/>
      <text x="269" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">2</text>
      <text x="269" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Caesar Unshift</text>
      <text x="269" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Reverse letter shift</text>
      <rect x="202" y="105" width="135" height="50" rx="4" fill="#0c1124"/>
      <text x="269" y="125" text-anchor="middle" font-family="monospace" font-size="10" fill="#c084fc">(c - shift) % 26</text>
      <text x="269" y="142" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Alpha Restored</text>

      <!-- Stage 3 -->
      <rect x="375" y="0" width="165" height="175" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="457" cy="30" r="16" fill="#34d399" fill-opacity="0.2"/>
      <text x="457" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">3</text>
      <text x="457" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">XOR Decrypt</text>
      <text x="457" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Apply secret key</text>
      <rect x="390" y="105" width="135" height="50" rx="4" fill="#0c1124"/>
      <text x="457" y="125" text-anchor="middle" font-family="monospace" font-size="10" fill="#34d399">byte ^ key[i % len]</text>
      <text x="457" y="142" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">Secret Plaintext!</text>
    </g>
  
</svg>