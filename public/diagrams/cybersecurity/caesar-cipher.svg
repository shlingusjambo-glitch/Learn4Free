<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">CAESAR SHIFT CIPHER &amp; FREQUENCY ANALYSIS</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Rotating the alphabet by Key K=3. Reversible with (X - K) mod 26.</text>

    <!-- Shift Visualization -->
    <g transform="translate(30, 80)">
      <rect width="540" height="100" rx="8" fill="url(#cardGrad)" stroke="#253158" stroke-width="1.5"/>
      <text x="20" y="35" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Plaintext Alphabet:</text>
      <g transform="translate(160, 20)">
        <rect width="360" height="24" rx="4" fill="#0c1124" stroke="#38bdf8" stroke-width="1"/>
        <text x="180" y="16" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="4">A B C D E F G H I J K L M ...</text>
      </g>

      <path d="M 230 46 L 275 68" stroke="#ffd600" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="260" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffd600">+3 Shift</text>

      <text x="20" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Ciphertext (K=3):</text>
      <g transform="translate(160, 68)">
        <rect width="360" height="24" rx="4" fill="#0c1124" stroke="#ffd600" stroke-width="1"/>
        <text x="180" y="16" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ffd600" letter-spacing="4">D E F G H I J K L M N O P ...</text>
      </g>
    </g>

    <!-- Vulnerability Alert Card -->
    <g transform="translate(30, 195)">
      <rect width="540" height="75" rx="8" fill="#1b1c31" stroke="#f87171" stroke-width="1"/>
      <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">VULNERABILITY: TINY KEYSPACE (Only 25 shifts)</text>
      <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Attacker tests shifts 1..25 in 0.001s or performs letter frequency analysis (E, T, A appear most).</text>
      <text x="20" y="65" font-family="monospace" font-size="11" fill="#38bdf8">caesar_decrypt(ciphertext, k) for k in range(1, 26)  # Solved instantly!</text>
    </g>
  
</svg>