<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">SLIDING WINDOW RATE LIMITING</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Preventing DoS &amp; brute-force attacks: max 5 requests per 10-second sliding window.</text>

    <!-- Sliding Window Timeline -->
    <g transform="translate(30, 80)">
      <rect width="540" height="185" rx="8" fill="url(#cardGrad)" stroke="#253158" stroke-width="1.5"/>

      <!-- Timeline Bar -->
      <line x1="30" y1="90" x2="510" y2="90" stroke="#475569" stroke-width="2"/>

      <!-- Window Frame -->
      <rect x="120" y="40" width="300" height="100" rx="6" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
      <text x="270" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">10-SECOND SLIDING WINDOW (Capacity: 5)</text>

      <!-- Requests 1 to 5 (Allowed) -->
      <g fill="#34d399">
        <circle cx="150" cy="90" r="10"/>
        <circle cx="190" cy="90" r="10"/>
        <circle cx="230" cy="90" r="10"/>
        <circle cx="280" cy="90" r="10"/>
        <circle cx="340" cy="90" r="10"/>
      </g>
      <text x="245" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">5 Requests Allowed (OK 200)</text>

      <!-- Request 6 (Blocked) -->
      <circle cx="390" cy="90" r="12" fill="#dc2626"/>
      <line x1="382" y1="82" x2="398" y2="98" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="398" y1="82" x2="382" y2="98" stroke="#ffffff" stroke-width="2.5"/>
      <text x="390" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">Req #6: BLOCKED</text>
      <text x="390" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fca5a5">HTTP 429 Too Many Req</text>

      <!-- Window eviction note -->
      <text x="30" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Old requests outside window expire automatically: <tspan font-family="monospace" fill="#ffd600">req.time &gt; now - window_seconds</tspan></text>
    </g>
  
</svg>