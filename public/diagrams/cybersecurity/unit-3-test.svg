<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2447"/>
      <stop offset="100%" stop-color="#161e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="597" height="297" rx="10.5" fill="none" stroke="#253158" stroke-width="1.5"/>
  
    <!-- Header -->
    <text x="30" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd600">E-COMMERCE WEB FORM DEFENSE FIREWALL</text>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Multi-stage inspection: sanitize HTML, detect SQL injection patterns, enforce numeric limits.</text>

    <!-- Firewall Pipeline -->
    <g transform="translate(30, 80)">
      <rect width="540" height="185" rx="8" fill="url(#cardGrad)" stroke="#253158" stroke-width="1.5"/>

      <!-- Pipe stages -->
      <g transform="translate(15, 25)">
        <rect width="155" height="135" rx="6" fill="#0c1124" stroke="#38bdf8" stroke-width="1"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">STAGE 1: SQLi FILTER</text>
        <text x="15" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Inspects queries for:</text>
        <text x="15" y="62" font-family="monospace" font-size="10" fill="#f87171">' OR '1'='1</text>
        <text x="15" y="78" font-family="monospace" font-size="10" fill="#f87171">UNION SELECT</text>
        <text x="15" y="94" font-family="monospace" font-size="10" fill="#f87171">DROP TABLE</text>
        <text x="15" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffd600">BLOCK &amp; LOG</text>
      </g>

      <g transform="translate(190, 25)">
        <rect width="155" height="135" rx="6" fill="#0c1124" stroke="#c084fc" stroke-width="1"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">STAGE 2: XSS ENCODER</text>
        <text x="15" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Escapes markup:</text>
        <text x="15" y="62" font-family="monospace" font-size="10" fill="#34d399">&lt; -&gt; &amp;lt;</text>
        <text x="15" y="78" font-family="monospace" font-size="10" fill="#34d399">&gt; -&gt; &amp;gt;</text>
        <text x="15" y="94" font-family="monospace" font-size="10" fill="#34d399">" -&gt; &amp;quot;</text>
        <text x="15" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">SAFE DISPLAY</text>
      </g>

      <g transform="translate(365, 25)">
        <rect width="160" height="135" rx="6" fill="#0c1124" stroke="#34d399" stroke-width="1"/>
        <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">STAGE 3: BOUNDS</text>
        <text x="15" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Quantity &amp; lengths:</text>
        <text x="15" y="62" font-family="monospace" font-size="10" fill="#ffd600">1 &lt;= qty &lt;= 99</text>
        <text x="15" y="78" font-family="monospace" font-size="10" fill="#ffd600">len(review) &lt; 500</text>
        <text x="15" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">TRANSACTION OK</text>
      </g>
    </g>
  
</svg>