<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradU2T" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGradU2T)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="150" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#ffd600" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">UNIT 2 CAPSTONE</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Retro Arcade Tournament Filter</text>

  <!-- Left: Arcade Machine Scanner -->
  <g transform="translate(30, 75)">
    <rect width="250" height="180" rx="8" fill="#151c33" stroke="#ffd600" stroke-width="1.5"/>
    <rect width="250" height="28" rx="8" fill="#242338"/>
    <text x="125" y="19" text-anchor="middle" fill="#ffd600" font-family="monospace" font-size="11" font-weight="700">for (i = 1; i &lt;= n; i++)</text>

    <!-- Score check -->
    <rect x="15" y="42" width="220" height="40" rx="4" fill="#1e294b"/>
    <text x="25" y="66" fill="#38bdf8" font-family="monospace" font-size="11">if (score &gt;= 1000)</text>

    <text x="35" y="105" fill="#34d399" font-family="monospace" font-size="10">&bull; print [QUALIFIED]</text>
    <text x="35" y="125" fill="#34d399" font-family="monospace" font-size="10">&bull; qualified_count++</text>
    <text x="35" y="145" fill="#ffd600" font-family="monospace" font-size="10">&bull; if (score &gt; max) max = score</text>
    <text x="35" y="165" fill="#ef4444" font-family="monospace" font-size="10">else &bull; print [TRY AGAIN]</text>
  </g>

  <!-- Connector -->
  <path d="M 290 165 L 325 165" stroke="#ffd600" stroke-width="2"/>
  <polygon points="328,165 320,160 320,170" fill="#ffd600"/>

  <!-- Right: Final Roster Display -->
  <g transform="translate(335, 75)">
    <rect width="235" height="180" rx="8" fill="#070a16" stroke="#34d399" stroke-width="1.5"/>
    <rect width="235" height="28" rx="8" fill="#162e2c"/>
    <text x="117" y="19" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">ROSTER SUMMARY</text>

    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="11">--- TOURNAMENT ROSTER ---</text>

    <!-- Qualified Stat -->
    <rect x="15" y="70" width="205" height="38" rx="4" fill="#151c33" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="94" fill="#e2e8f0" font-family="monospace" font-size="11">Qualified: <tspan fill="#34d399" font-weight="700">2</tspan> / <tspan fill="#38bdf8">4</tspan></text>

    <!-- High Score Stat -->
    <rect x="15" y="118" width="205" height="38" rx="4" fill="#151c33" stroke="#ffd600" stroke-width="1"/>
    <text x="25" y="142" fill="#e2e8f0" font-family="monospace" font-size="11">High Score: <tspan fill="#ffd600" font-weight="700">3400</tspan></text>

    <text x="117" y="174" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="9">Leaderboard state preserved</text>
  </g>

  <text x="300" y="280" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Accumulating counts and tracking peak values across loop iterations.
  </text>
</svg>