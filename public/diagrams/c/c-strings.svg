<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradU5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGradU5)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="170" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">NULL-TERMINATED STRINGS</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Stranger Things Morse Code &bull; '\0'</text>

  <!-- String Memory Array: "VOYAGER" + '\0' -->
  <g transform="translate(30, 80)">
    <!-- 8 Cells -->
    <!-- 'V' -->
    <g transform="translate(0, 0)">
      <rect width="60" height="80" rx="6" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="30" y="22" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">[0]</text>
      <text x="30" y="52" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="700">'V'</text>
      <text x="30" y="70" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">86</text>
    </g>

    <!-- 'O' -->
    <g transform="translate(65, 0)">
      <rect width="60" height="80" rx="6" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="30" y="22" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">[1]</text>
      <text x="30" y="52" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="700">'O'</text>
      <text x="30" y="70" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">79</text>
    </g>

    <!-- 'Y' -->
    <g transform="translate(130, 0)">
      <rect width="60" height="80" rx="6" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="30" y="22" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">[2]</text>
      <text x="30" y="52" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="700">'Y'</text>
      <text x="30" y="70" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">89</text>
    </g>

    <!-- 'A' -->
    <g transform="translate(195, 0)">
      <rect width="60" height="80" rx="6" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="30" y="22" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">[3]</text>
      <text x="30" y="52" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="700">'A'</text>
      <text x="30" y="70" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">65</text>
    </g>

    <!-- 'G' -->
    <g transform="translate(260, 0)">
      <rect width="60" height="80" rx="6" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="30" y="22" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">[4]</text>
      <text x="30" y="52" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="700">'G'</text>
      <text x="30" y="70" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">71</text>
    </g>

    <!-- 'E' -->
    <g transform="translate(325, 0)">
      <rect width="60" height="80" rx="6" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="30" y="22" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">[5]</text>
      <text x="30" y="52" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="700">'E'</text>
      <text x="30" y="70" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">69</text>
    </g>

    <!-- 'R' -->
    <g transform="translate(390, 0)">
      <rect width="60" height="80" rx="6" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="30" y="22" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">[6]</text>
      <text x="30" y="52" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="700">'R'</text>
      <text x="30" y="70" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">82</text>
    </g>

    <!-- '\0' NULL TERMINATOR (Sentinel Guard) -->
    <g transform="translate(455, 0)">
      <rect width="80" height="80" rx="6" fill="#2d121c" stroke="#ef4444" stroke-width="2"/>
      <text x="40" y="22" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="9">[7] NULL</text>
      <text x="40" y="52" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="22" font-weight="900">'\0'</text>
      <text x="40" y="70" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="8">Byte 0 (STOP)</text>
    </g>
  </g>

  <!-- Walking Pointer Scan -->
  <g transform="translate(30, 180)">
    <rect width="535" height="70" rx="6" fill="#151c33" stroke="#ffd600" stroke-width="1.5"/>
    <text x="20" y="25" fill="#ffd600" font-family="monospace" font-size="11" font-weight="700">strlen() &amp; Pointer Traversal Mechanism:</text>
    <text x="20" y="45" fill="#e2e8f0" font-family="monospace" font-size="10">while (*ptr != '\0') { len++; ptr++; }</text>
    <text x="20" y="60" fill="#94a3b8" font-family="system-ui" font-size="9">Stops immediately when encountering the sentinel null byte (value 0). Length = 7 characters.</text>
  </g>

  <text x="300" y="278" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Without <tspan fill="#ef4444" font-weight="700">'\0'</tspan>, string functions keep reading forever into adjacent memory.
  </text>
</svg>