<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradU3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGradU3)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="180" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">FUNCTION ANATOMY</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Mission Impossible Gadget Box</text>

  <!-- Prototype Banner across top -->
  <g transform="translate(30, 65)">
    <rect width="540" height="38" rx="6" fill="#151c33" stroke="#ffd600" stroke-width="1.5"/>
    <text x="15" y="24" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="700">PROTOTYPE:</text>
    <text x="100" y="24" fill="#f472b6" font-family="monospace" font-size="11" font-weight="700">int</text>
    <text x="130" y="24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">calculate_shield</text>
    <text x="250" y="24" fill="#e2e8f0" font-family="monospace" font-size="11">(<tspan fill="#fbbf24">int base</tspan>, <tspan fill="#34d399">int multiplier</tspan>);</text>
    <text x="525" y="24" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">; (Notice Semicolon)</text>
  </g>

  <!-- Black Box Function Machine -->
  <g transform="translate(180, 120)">
    <rect width="240" height="135" rx="8" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="240" height="26" rx="8" fill="#1b2545"/>
    <text x="120" y="18" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">calculate_shield()</text>

    <!-- Inside the machine -->
    <rect x="20" y="42" width="200" height="42" rx="4" fill="#1e294b"/>
    <text x="120" y="68" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">return base * mult;</text>

    <text x="120" y="112" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Isolated Stack Frame</text>
  </g>

  <!-- Input Feeder Left -->
  <g transform="translate(30, 140)">
    <rect width="115" height="95" rx="6" fill="#1e294b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="57" y="22" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">INPUTS</text>
    <text x="15" y="48" fill="#e2e8f0" font-family="monospace" font-size="11">base: <tspan fill="#38bdf8">10</tspan></text>
    <text x="15" y="70" fill="#e2e8f0" font-family="monospace" font-size="11">mult: <tspan fill="#34d399">5</tspan></text>
  </g>
  <line x1="145" y1="187" x2="180" y2="187" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="180,187 172,182 172,192" fill="#fbbf24"/>

  <!-- Output Delivery Right -->
  <g transform="translate(455, 140)">
    <rect width="115" height="95" rx="6" fill="#1e294b" stroke="#34d399" stroke-width="1.5"/>
    <text x="57" y="22" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">RETURN</text>
    <text x="57" y="58" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="16" font-weight="700">50</text>
    <text x="57" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Pushed to Caller</text>
  </g>
  <line x1="420" y1="187" x2="455" y2="187" stroke="#34d399" stroke-width="2"/>
  <polygon points="455,187 447,182 447,192" fill="#34d399"/>

  <text x="300" y="280" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Prototypes declare signatures before <tspan fill="#38bdf8">main()</tspan>; definitions implement instructions after.
  </text>
</svg>