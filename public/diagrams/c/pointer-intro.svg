<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradU4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGradU4)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="175" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">POINTER MECHANICS</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Street Addresses of RAM City</text>

  <!-- Left: Pointer Variable ptr -->
  <g transform="translate(45, 80)">
    <rect width="210" height="155" rx="8" fill="#151c33" stroke="#ffd600" stroke-width="1.5"/>
    <rect width="210" height="28" rx="8" fill="#242338"/>
    <text x="105" y="19" text-anchor="middle" fill="#ffd600" font-family="monospace" font-size="11" font-weight="700">int *ptr = &amp;secret;</text>

    <text x="15" y="55" fill="#94a3b8" font-family="monospace" font-size="9">Pointer Memory Addr: 0x1008</text>

    <!-- Inside the pointer box: stores an address -->
    <rect x="15" y="68" width="180" height="50" rx="4" fill="#1e294b" stroke="#ffd600" stroke-width="1.5"/>
    <text x="25" y="88" fill="#94a3b8" font-family="system-ui" font-size="9">STORED VALUE (Target Addr):</text>
    <text x="25" y="108" fill="#ffd600" font-family="monospace" font-size="14" font-weight="700">0x1004</text>

    <text x="105" y="142" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="9">Size: 8 bytes (64-bit architecture)</text>
  </g>

  <!-- Arrow pointing from ptr to secret -->
  <g transform="translate(255, 140)">
    <path d="M 5 15 C 45 15, 45 15, 85 15" stroke="#34d399" stroke-width="3" fill="none"/>
    <polygon points="85,15 75,9 75,21" fill="#34d399"/>
    <circle cx="5" cy="15" r="4" fill="#ffd600"/>
    <text x="45" y="5" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">*ptr</text>
    <text x="45" y="34" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8">Dereference</text>
  </g>

  <!-- Right: Target Variable secret -->
  <g transform="translate(345, 80)">
    <rect width="210" height="155" rx="8" fill="#151c33" stroke="#34d399" stroke-width="1.5"/>
    <rect width="210" height="28" rx="8" fill="#162e2c"/>
    <text x="105" y="19" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">int secret = 1337;</text>

    <text x="15" y="55" fill="#ffd600" font-family="monospace" font-size="9">Physical RAM Addr: 0x1004</text>

    <!-- Inside the target box: stores an integer -->
    <rect x="15" y="68" width="180" height="50" rx="4" fill="#1e294b" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="88" fill="#94a3b8" font-family="system-ui" font-size="9">STORED DATA (Integer):</text>
    <text x="25" y="108" fill="#34d399" font-family="monospace" font-size="15" font-weight="700">1337 &rarr; 2048</text>

    <text x="105" y="142" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="9">Size: 4 bytes (int)</text>
  </g>

  <!-- Bottom explanation -->
  <text x="300" y="275" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    <tspan fill="#ffd600">&amp;secret</tspan> gets the street address; <tspan fill="#34d399">*ptr</tspan> follows the address to read or write the house contents.
  </text>
</svg>