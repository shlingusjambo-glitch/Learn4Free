<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGradSb)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="180" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#ffd600" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">STRUCT MEMORY BLUEPRINT</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Pokémon / RPG Character Card</text>

  <!-- Left: Struct Definition Code -->
  <g transform="translate(30, 70)">
    <rect width="230" height="185" rx="8" fill="#151c33" stroke="#ffd600" stroke-width="1.5"/>
    <rect width="230" height="28" rx="8" fill="#242338"/>
    <text x="115" y="19" text-anchor="middle" fill="#ffd600" font-family="monospace" font-size="11" font-weight="700">struct Character</text>

    <text x="20" y="55" fill="#f472b6" font-family="monospace" font-size="11">struct Character {</text>
    <text x="35" y="75" fill="#38bdf8" font-family="monospace" font-size="11">char name[30];</text>
    <text x="35" y="95" fill="#34d399" font-family="monospace" font-size="11">int hp;</text>
    <text x="35" y="115" fill="#fbbf24" font-family="monospace" font-size="11">int attack;</text>
    <text x="35" y="135" fill="#a855f7" font-family="monospace" font-size="11">int defense;</text>
    <text x="20" y="155" fill="#f472b6" font-family="monospace" font-size="11">};</text>
    <text x="115" y="175" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Composite Custom Type</text>
  </g>

  <!-- Middle Dot Operator -->
  <g transform="translate(265, 145)">
    <circle cx="20" cy="15" r="16" fill="#1e294b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="22" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="900">.</text>
    <text x="20" y="45" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8">Dot Operator</text>
  </g>

  <!-- Right: Instantiated Memory Block -->
  <g transform="translate(310, 70)">
    <rect width="260" height="185" rx="8" fill="#151c33" stroke="#34d399" stroke-width="1.5"/>
    <rect width="260" height="28" rx="8" fill="#162e2c"/>
    <text x="130" y="19" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">hero (Single Contiguous Block)</text>

    <!-- Field 1: name -->
    <rect x="15" y="38" width="230" height="30" rx="4" fill="#1e294b" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="58" fill="#38bdf8" font-family="monospace" font-size="10">hero.name: <tspan fill="#e2e8f0">"Pikachu"</tspan></text>
    <text x="235" y="58" text-anchor="end" fill="#64748b" font-family="monospace" font-size="9">30 bytes</text>

    <!-- Field 2: hp -->
    <rect x="15" y="73" width="230" height="30" rx="4" fill="#1e294b" stroke="#34d399" stroke-width="1"/>
    <text x="25" y="93" fill="#34d399" font-family="monospace" font-size="10">hero.hp: <tspan fill="#e2e8f0">120</tspan></text>
    <text x="235" y="93" text-anchor="end" fill="#64748b" font-family="monospace" font-size="9">4 bytes</text>

    <!-- Field 3: attack -->
    <rect x="15" y="108" width="230" height="30" rx="4" fill="#1e294b" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="128" fill="#fbbf24" font-family="monospace" font-size="10">hero.attack: <tspan fill="#e2e8f0">55</tspan></text>
    <text x="235" y="128" text-anchor="end" fill="#64748b" font-family="monospace" font-size="9">4 bytes</text>

    <!-- Field 4: defense -->
    <rect x="15" y="143" width="230" height="30" rx="4" fill="#1e294b" stroke="#a855f7" stroke-width="1"/>
    <text x="25" y="163" fill="#a855f7" font-family="monospace" font-size="10">hero.defense: <tspan fill="#e2e8f0">40</tspan></text>
    <text x="235" y="163" text-anchor="end" fill="#64748b" font-family="monospace" font-size="9">4 bytes</text>
  </g>

  <text x="300" y="278" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Structs group related heterogenous variables together under one unified custom datatype.
  </text>
</svg>