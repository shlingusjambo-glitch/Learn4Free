<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGrad4)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="150" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">UNIT 1 CAPSTONE</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Pop Concert Ticket Engine</text>

  <!-- Left: Arithmetic Engine -->
  <g transform="translate(30, 75)">
    <rect width="260" height="175" rx="8" fill="#151c33" stroke="#ffd600" stroke-width="1.5"/>
    <rect width="260" height="28" rx="8" fill="#242338"/>
    <text x="130" y="19" text-anchor="middle" fill="#ffd600" font-family="monospace" font-size="11" font-weight="700">CPU Arithmetic Pipeline</text>

    <!-- Formula 1 -->
    <rect x="15" y="40" width="230" height="34" rx="4" fill="#1e294b"/>
    <text x="25" y="62" fill="#38bdf8" font-family="monospace" font-size="11">subtotal = tickets * price</text>

    <!-- Formula 2 -->
    <rect x="15" y="84" width="230" height="34" rx="4" fill="#1e294b"/>
    <text x="25" y="106" fill="#f472b6" font-family="monospace" font-size="11">tax = subtotal * 0.08f</text>

    <!-- Formula 3 -->
    <rect x="15" y="128" width="230" height="34" rx="4" fill="#1e294b"/>
    <text x="25" y="150" fill="#34d399" font-family="monospace" font-size="11">total = subtotal + tax</text>
  </g>

  <!-- Arrow -->
  <path d="M 305 160 L 335 160" stroke="#ffd600" stroke-width="2"/>
  <polygon points="338,160 330,155 330,165" fill="#ffd600"/>

  <!-- Right: Formatted Thermal Receipt Card -->
  <g transform="translate(345, 65)">
    <rect width="225" height="195" rx="8" fill="#070a16" stroke="#34d399" stroke-width="1.5"/>
    <rect width="225" height="28" rx="8" fill="#162e2c"/>
    <text x="112" y="19" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">STDOUT RECEIPT</text>

    <text x="20" y="52" fill="#94a3b8" font-family="monospace" font-size="11">--- CONCERT RECEIPT ---</text>
    <text x="20" y="76" fill="#e2e8f0" font-family="monospace" font-size="11">Tickets: <tspan fill="#38bdf8">2</tspan> @ $<tspan fill="#38bdf8">89.50</tspan></text>
    <text x="20" y="100" fill="#e2e8f0" font-family="monospace" font-size="11">Subtotal: $<tspan fill="#ffd600">179.00</tspan></text>
    <text x="20" y="124" fill="#e2e8f0" font-family="monospace" font-size="11">Tax: $<tspan fill="#f472b6">14.32</tspan></text>
    <line x1="20" y1="138" x2="205" y2="138" stroke="#334155" stroke-dasharray="3,3"/>
    <text x="20" y="160" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">Total: $193.32</text>
    <text x="112" y="184" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Precision: %.2f everywhere</text>
  </g>

  <text x="300" y="280" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    All currency figures strictly formatted to <tspan fill="#34d399" font-weight="700">%.2f</tspan> decimal precision.
  </text>
</svg>