<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGradSc)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="175" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SWITCH-CASE SELECTOR</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Spotify / Jukebox Jump Table</text>

  <!-- Left: Switch Expression Input -->
  <g transform="translate(30, 80)">
    <rect width="140" height="150" rx="8" fill="#151c33" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="140" height="28" rx="8" fill="#241e3d"/>
    <text x="70" y="19" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="11" font-weight="700">switch (mode)</text>
    <text x="70" y="65" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Inspects discrete</text>
    <text x="70" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">char or integer</text>
    <rect x="25" y="100" width="90" height="30" rx="4" fill="#1e294b" stroke="#ffd600" stroke-width="1"/>
    <text x="70" y="120" text-anchor="middle" fill="#ffd600" font-family="monospace" font-size="13" font-weight="700">'S' | 'R' | 'A'</text>
  </g>

  <!-- Jump Lines -->
  <path d="M 170 120 C 190 120, 200 95, 220 95" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <polygon points="220,95 212,90 212,100" fill="#38bdf8"/>

  <path d="M 170 120 C 190 120, 200 145, 220 145" stroke="#f472b6" stroke-width="2" fill="none"/>
  <polygon points="220,145 212,140 212,150" fill="#f472b6"/>

  <path d="M 170 120 C 190 120, 200 195, 220 195" stroke="#34d399" stroke-width="2" fill="none"/>
  <polygon points="220,195 212,190 212,200" fill="#34d399"/>

  <path d="M 170 140 C 185 160, 200 245, 220 245" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <polygon points="220,245 212,240 212,250" fill="#94a3b8"/>

  <!-- Right: Case Blocks -->
  <g transform="translate(225, 75)">
    <!-- Case 'S' -->
    <rect x="0" y="0" width="220" height="40" rx="6" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">case 'S':</text>
    <text x="80" y="24" fill="#e2e8f0" font-family="system-ui" font-size="10">Shuffle enabled &rarr; break;</text>

    <!-- Case 'R' -->
    <rect x="0" y="50" width="220" height="40" rx="6" fill="#151c33" stroke="#f472b6" stroke-width="1.5"/>
    <text x="12" y="74" fill="#f472b6" font-family="monospace" font-size="11" font-weight="700">case 'R':</text>
    <text x="80" y="74" fill="#e2e8f0" font-family="system-ui" font-size="10">Repeat enabled &rarr; break;</text>

    <!-- Case 'A' -->
    <rect x="0" y="100" width="220" height="40" rx="6" fill="#151c33" stroke="#34d399" stroke-width="1.5"/>
    <text x="12" y="124" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">case 'A':</text>
    <text x="80" y="124" fill="#e2e8f0" font-family="system-ui" font-size="10">Autoplay enabled &rarr; break;</text>

    <!-- default: -->
    <rect x="0" y="150" width="220" height="40" rx="6" fill="#151c33" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="12" y="174" fill="#ffd600" font-family="monospace" font-size="11" font-weight="700">default:</text>
    <text x="75" y="174" fill="#94a3b8" font-family="system-ui" font-size="10">Standard playback &rarr; break;</text>
  </g>

  <!-- Break Exit Collector on the right -->
  <path d="M 445 95 L 490 95 L 490 155" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  <path d="M 445 145 L 490 145" stroke="#f472b6" stroke-width="1.5" fill="none"/>
  <path d="M 445 195 L 490 195 L 490 155" stroke="#34d399" stroke-width="1.5" fill="none"/>
  <path d="M 445 245 L 490 245 L 490 155" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <g transform="translate(505, 125)">
    <rect width="70" height="60" rx="6" fill="#1e294b" stroke="#ffd600" stroke-width="1.5"/>
    <text x="35" y="26" text-anchor="middle" fill="#ffd600" font-family="monospace" font-size="11" font-weight="700">EXIT</text>
    <text x="35" y="44" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8">break skips</text>
    <text x="35" y="54" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="8">remaining</text>
  </g>
</svg>