<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGrad2)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="195" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PRINTF FORMAT MAPPING</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">C-3PO / Universal Translator</text>

  <!-- Format String Box -->
  <g transform="translate(30, 75)">
    <rect width="540" height="60" rx="8" fill="#151c33" stroke="#475569" stroke-width="1.5"/>
    <text x="20" y="36" fill="#94a3b8" font-family="monospace" font-size="13">printf("Ship: </text>
    <rect x="110" y="18" width="30" height="26" rx="4" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="125" y="36" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">%s</text>

    <text x="145" y="36" fill="#94a3b8" font-family="monospace" font-size="13"> [</text>
    <rect x="160" y="18" width="30" height="26" rx="4" fill="#f472b6" fill-opacity="0.2" stroke="#f472b6" stroke-width="1.5"/>
    <text x="175" y="36" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="13" font-weight="700">%c</text>

    <text x="195" y="36" fill="#94a3b8" font-family="monospace" font-size="13">] | Crew: </text>
    <rect x="270" y="18" width="30" height="26" rx="4" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="285" y="36" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">%d</text>

    <text x="305" y="36" fill="#94a3b8" font-family="monospace" font-size="13"> | Fuel: </text>
    <rect x="365" y="18" width="45" height="26" rx="4" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5"/>
    <text x="387" y="36" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">%.1f</text>

    <text x="415" y="36" fill="#94a3b8" font-family="monospace" font-size="13">%%\n", ...);</text>
  </g>

  <!-- Connecting Arrows -->
  <path d="M 125 135 L 100 185" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="100,190 95,180 105,182" fill="#38bdf8"/>

  <path d="M 175 135 L 220 185" stroke="#f472b6" stroke-width="2"/>
  <polygon points="222,190 216,182 226,182" fill="#f472b6"/>

  <path d="M 285 135 L 340 185" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="342,190 336,182 346,182" fill="#fbbf24"/>

  <path d="M 387 135 L 465 185" stroke="#34d399" stroke-width="2"/>
  <polygon points="467,190 460,182 470,183" fill="#34d399"/>

  <!-- Variable Cards Below -->
  <g transform="translate(30, 195)">
    <!-- %s String -->
    <rect x="15" y="0" width="110" height="70" rx="6" fill="#1e294b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">ship</text>
    <text x="70" y="44" text-anchor="middle" fill="#a3e635" font-family="monospace" font-size="11">"Starliner"</text>
    <text x="70" y="60" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">%s (String)</text>

    <!-- %c Char -->
    <rect x="150" y="0" width="100" height="70" rx="6" fill="#1e294b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="200" y="24" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="11" font-weight="700">grade</text>
    <text x="200" y="44" text-anchor="middle" fill="#a3e635" font-family="monospace" font-size="11">'A'</text>
    <text x="200" y="60" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">%c (Char)</text>

    <!-- %d Int -->
    <rect x="275" y="0" width="105" height="70" rx="6" fill="#1e294b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="327" y="24" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">crew</text>
    <text x="327" y="44" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11">42</text>
    <text x="327" y="60" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">%d (Decimal Int)</text>

    <!-- %.1f Float -->
    <rect x="405" y="0" width="115" height="70" rx="6" fill="#1e294b" stroke="#34d399" stroke-width="1.5"/>
    <text x="462" y="24" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">fuel</text>
    <text x="462" y="44" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">98.75f &rarr; 98.8</text>
    <text x="462" y="60" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">%.1f (Float 1-dec)</text>
  </g>
</svg>