<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGradMh)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="165" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#ffd600" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">&lt;MATH.H&gt; HELPERS</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Iron Man &bull; JARVIS Flight HUD</text>

  <!-- Formula Card 1: 2D Euclidean Distance -->
  <g transform="translate(30, 75)">
    <rect width="255" height="175" rx="8" fill="#151c33" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="255" height="28" rx="8" fill="#1b2545"/>
    <text x="127" y="19" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">Euclidean Distance</text>

    <!-- Formula Display -->
    <rect x="15" y="42" width="225" height="50" rx="4" fill="#1e294b"/>
    <text x="127" y="65" text-anchor="middle" fill="#ffd600" font-family="monospace" font-size="11">d = &radic;((x2-x1)&sup2; + (y2-y1)&sup2;)</text>
    <text x="127" y="82" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">sqrt(pow(dx, 2) + pow(dy, 2))</text>

    <text x="20" y="120" fill="#e2e8f0" font-family="system-ui" font-size="10">&bull; <tspan fill="#38bdf8" font-family="monospace">pow(base, exp)</tspan> raises to power</text>
    <text x="20" y="140" fill="#e2e8f0" font-family="system-ui" font-size="10">&bull; <tspan fill="#38bdf8" font-family="monospace">sqrt(x)</tspan> computes square root</text>
    <text x="20" y="160" fill="#e2e8f0" font-family="system-ui" font-size="10">&bull; Returns <tspan fill="#34d399">double</tspan> precision</text>
  </g>

  <!-- Formula Card 2: Kinetic Energy -->
  <g transform="translate(315, 75)">
    <rect width="255" height="175" rx="8" fill="#151c33" stroke="#f472b6" stroke-width="1.5"/>
    <rect width="255" height="28" rx="8" fill="#2d1a29"/>
    <text x="127" y="19" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="11" font-weight="700">Kinetic Energy</text>

    <!-- Formula Display -->
    <rect x="15" y="42" width="225" height="50" rx="4" fill="#1e294b"/>
    <text x="127" y="65" text-anchor="middle" fill="#ffd600" font-family="monospace" font-size="11">KE = &frac12; &bull; mass &bull; velocity&sup2;</text>
    <text x="127" y="82" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">0.5 * mass * pow(v, 2)</text>

    <text x="20" y="120" fill="#e2e8f0" font-family="system-ui" font-size="10">&bull; Uses standard SI Joules</text>
    <text x="20" y="140" fill="#e2e8f0" font-family="system-ui" font-size="10">&bull; Must link with <tspan fill="#f472b6" font-family="monospace">-lm</tspan> flag</text>
    <text x="20" y="160" fill="#e2e8f0" font-family="system-ui" font-size="10">&bull; Format with <tspan fill="#34d399">%.2f</tspan> in printf</text>
  </g>

  <text x="300" y="280" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Standard C requires <tspan fill="#ffd600">#include &lt;math.h&gt;</tspan> and links with libm for hardware floating math.
  </text>
</svg>