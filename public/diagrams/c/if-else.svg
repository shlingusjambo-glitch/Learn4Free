<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradU2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" rx="12" fill="url(#bgGradU2)"/>
  <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#242d4a" stroke-width="1.5"/>

  <rect x="24" y="20" width="165" height="28" rx="6" fill="#1e294b"/>
  <text x="34" y="39" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">IF-ELSE BRANCHING</text>
  <text x="576" y="39" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">The Matrix &bull; Morpheus's Choice</text>

  <!-- Condition Diamond in center -->
  <g transform="translate(300, 110)">
    <polygon points="0,-35 75,0 0,35 -75,0" fill="#1e294b" stroke="#ffd600" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#ffd600" font-family="monospace" font-size="11" font-weight="700">choice == 1 ?</text>
    <text x="0" y="12" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">(Boolean Check)</text>
  </g>

  <!-- Entry Line -->
  <line x1="300" y1="50" x2="300" y2="75" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="300,75 296,67 304,67" fill="#38bdf8"/>
  <text x="300" y="62" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="10">input &nbsp;</text>

  <!-- Branch Left: True (Red Pill) -->
  <path d="M 225 110 L 150 110 L 150 155" stroke="#ef4444" stroke-width="2" fill="none"/>
  <polygon points="150,158 146,150 154,150" fill="#ef4444"/>
  <text x="185" y="103" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="11" font-weight="700">true (1)</text>

  <!-- Red Pill Node -->
  <g transform="translate(70, 160)">
    <rect width="160" height="70" rx="8" fill="#1c1219" stroke="#ef4444" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="11" font-weight="700">if (choice == 1)</text>
    <text x="80" y="44" text-anchor="middle" fill="#fca5a5" font-family="system-ui" font-size="10">Red Pill chosen</text>
    <text x="80" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Stay in Wonderland</text>
  </g>

  <!-- Branch Right: False (Blue Pill / Else) -->
  <path d="M 375 110 L 450 110 L 450 155" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <polygon points="450,158 446,150 454,150" fill="#38bdf8"/>
  <text x="415" y="103" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">false (else)</text>

  <!-- Blue Pill Node -->
  <g transform="translate(370, 160)">
    <rect width="160" height="70" rx="8" fill="#0f1d2e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">else if (choice == 2)</text>
    <text x="80" y="44" text-anchor="middle" fill="#bae6fd" font-family="system-ui" font-size="10">Blue Pill chosen</text>
    <text x="80" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">Wake up in your bed</text>
  </g>

  <!-- Bottom Merge -->
  <path d="M 150 230 L 150 255 L 450 255 L 450 230" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <line x1="300" y1="255" x2="300" y2="280" stroke="#34d399" stroke-width="2"/>
  <polygon points="300,282 296,274 304,274" fill="#34d399"/>
  <text x="315" y="274" fill="#34d399" font-family="monospace" font-size="10">program resumes</text>
</svg>