<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-for-ranges" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="box-for-ranges" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="220" rx="12" fill="url(#bg-for-ranges)" stroke="#334155" stroke-width="1.5"/>
  <text x="300" y="32" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Deterministic for Iteration over Ranges</text>

  <!-- Step 1 -->
  <g transform="translate(30, 65)">
    <rect width="115" height="115" rx="8" fill="url(#box-for-ranges)" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="20" cy="20" r="10" fill="#0284c7"/>
    <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">1</text>
    <text x="58" y="55" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Range 0..5</text>
    <rect x="12" y="70" width="91" height="28" rx="4" fill="#020617" stroke="#1e293b"/>
    <text x="58" y="88" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="monospace">INPUT</text>
  </g>

  <!-- Flow 1 -->
  <path d="M 155 122 L 175 122" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="175,118 183,122 175,126" fill="#38bdf8"/>

  <!-- Step 2 -->
  <g transform="translate(185, 65)">
    <rect width="115" height="115" rx="8" fill="url(#box-for-ranges)" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="20" cy="20" r="10" fill="#d97706"/>
    <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">2</text>
    <text x="58" y="55" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Iterator State</text>
    <rect x="12" y="70" width="91" height="28" rx="4" fill="#020617" stroke="#1e293b"/>
    <text x="58" y="88" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="monospace">PROCESS</text>
  </g>

  <!-- Flow 2 -->
  <path d="M 310 122 L 330 122" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="330,118 338,122 330,126" fill="#f59e0b"/>

  <!-- Step 3 -->
  <g transform="translate(340, 65)">
    <rect width="115" height="115" rx="8" fill="url(#box-for-ranges)" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="20" cy="20" r="10" fill="#059669"/>
    <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">3</text>
    <text x="58" y="55" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Item Value</text>
    <rect x="12" y="70" width="91" height="28" rx="4" fill="#020617" stroke="#1e293b"/>
    <text x="58" y="88" fill="#34d399" font-size="10" text-anchor="middle" font-family="monospace">MEMORY</text>
  </g>

  <!-- Flow 3 -->
  <path d="M 465 122 L 485 122" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="485,118 493,122 485,126" fill="#10b981"/>

  <!-- Step 4 -->
  <g transform="translate(495, 65)">
    <rect width="80" height="115" rx="8" fill="url(#box-for-ranges)" stroke="#818cf8" stroke-width="1.8"/>
    <circle cx="20" cy="20" r="10" fill="#4f46e5"/>
    <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">4</text>
    <text x="40" y="55" fill="#818cf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Exhausted Loop</text>
    <rect x="8" y="70" width="64" height="28" rx="4" fill="#020617" stroke="#1e293b"/>
    <text x="40" y="88" fill="#a5b4fc" font-size="10" text-anchor="middle" font-family="monospace">OUTPUT</text>
  </g>
</svg>